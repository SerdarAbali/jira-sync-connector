modules:
  jira:adminPage:
    - key: sync-connector-admin
      resource: admin-ui
      resolver:
        function: resolver
      title: Sync Connector Configuration

  trigger:
    - key: issue-created
      function: sync-trigger
      events:
        - avi:jira:created:issue

    - key: issue-updated
      function: sync-trigger
      events:
        - avi:jira:updated:issue

    - key: issue-commented
      function: comment-trigger
      events:
        - avi:jira:commented:issue

    - key: issue-link-created
      function: link-trigger
      events:
        - avi:jira:created:issuelink

    - key: issue-link-deleted
      function: link-deleted-trigger
      events:
        - avi:jira:deleted:issuelink

    - key: issue-deleted
      function: issue-deleted-trigger
      events:
        - avi:jira:deleted:issue

    - key: attachment-created
      function: attachment-trigger
      events:
        - avi:jira:created:attachment
      filter:
        ignoreSelf: true

    - key: attachment-deleted
      function: attachment-trigger
      events:
        - avi:jira:deleted:attachment
      filter:
        ignoreSelf: true

  scheduledTrigger:
    - key: scheduled-sync
      interval: hour
      function: scheduled-sync-function

    - key: initial-sync-recovery
      interval: hour
      function: initial-sync-recover-fn

  consumer:
    - key: bulk-sync-consumer
      queue: bulk-sync-queue
      function: bulk-sync-function

    - key: manual-sync-consumer
      queue: manual-sync-queue
      function: manual-sync-func

    - key: attachment-sync-consumer
      queue: attachment-sync-queue
      function: attachment-sync-func

    - key: initial-sync-consumer
      queue: initial-sync-queue
      function: initial-sync-function

  webtrigger:
    - key: incoming-webhook
      function: incoming-webhook-func
      response:
        type: dynamic

  function:
    - key: sync-trigger
      handler: index.run

    - key: comment-trigger
      handler: index.runComment

    - key: link-trigger
      handler: index.runLinkCreated

    - key: link-deleted-trigger
      handler: index.runLinkDeleted

    - key: issue-deleted-trigger
      handler: index.runIssueDeleted

    - key: attachment-trigger
      handler: index.runAttachment

    - key: scheduled-sync-function
      handler: index.runScheduledSync
      timeoutSeconds: 900

    - key: bulk-sync-function
      handler: index.runBulkSync
      timeoutSeconds: 900

    - key: manual-sync-func
      handler: index.runManualScheduledSync
      timeoutSeconds: 900

    - key: attachment-sync-func
      handler: index.runAttachmentSyncQueue
      timeoutSeconds: 300

    - key: initial-sync-function
      handler: index.runInitialSync
      timeoutSeconds: 900

    - key: initial-sync-recover-fn
      handler: index.runInitialSyncRecovery
      timeoutSeconds: 300

    - key: incoming-webhook-func
      handler: index.runIncomingWebhook

    - key: resolver
      handler: index.handler

resources:
  - key: admin-ui
    path: static/admin-page/build

app:
  storage:
    entities:
      - name: issue-lease
        attributes:
          leaseToken:
            type: string
          expiresAt:
            type: float
      # F06 outbound comment submission phase. One record per destination
      # operation, read by key and updated only through conditional
      # transactions, so Forge's automatic by-key index is sufficient and no
      # custom index is declared (see docs/F07-ISSUE-LEASE-DECISION.md:83).
      # Every attribute below is written by
      # src/services/sync/comment-submission.js:operationRecord, and `token` and
      # `state` are the attributes its transaction predicates filter on.
      - name: comment-submission
        attributes:
          orgId:
            type: string
          direction:
            type: string
          issueKey:
            type: string
          commentId:
            type: string
          remoteKey:
            type: string
          state:
            type: string
          token:
            type: string
          reason:
            type: string
          createdAt:
            type: float
          updatedAt:
            type: float
  id: ari:cloud:ecosystem::app/362d8e6b-b68c-4403-8020-d32ddcc02716
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    - storage:app
    # Temporary broad scopes retained for the corporate pilot. read:jira-work
    # is needed by issue triggers, write:jira-work still covers issue deletion
    # and other broad writes, and read:jira-user still supplies account data.
    # A granular migration is a separate, live-tested change.
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:comment:jira
    - write:comment:jira
    - write:issue-link:jira
    - read:issue-meta:jira
    - read:project:jira
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
  content:
    styles: []
