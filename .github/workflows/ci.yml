name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/admin-page/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin UI dependencies
        working-directory: static/admin-page
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Repository neutrality (committed text)
        run: npm run check:neutrality -- --committed

      - name: Lint source
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Secret and repository hygiene scan
        run: npm run check:secrets

      - name: Audit admin production dependencies
        working-directory: static/admin-page
        run: npm audit --omit=dev --audit-level=high

      - name: Build admin UI
        working-directory: static/admin-page
        run: npm run build

      - name: Configure Forge CLI for non-interactive use
        run: ./node_modules/.bin/forge settings set usage-analytics false

      - name: Forge lint (offline static checks)
        run: npm run check:forge:offline
